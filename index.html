<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>拨打电话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #13131a;
      --border: #252530;
      --accent: #22c55e;
      --accent-glow: #22c55e33;
      --text-primary: #f0f0f4;
      --text-secondary: #9a9aaa;
      --text-muted: #5a5a68;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* 背景光效 */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.4;
      pointer-events: none;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
      50%      { opacity: 0.5; transform: translateX(-50%) scale(1.1); }
    }

    /* 噪点 */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* 头像 */
    .avatar-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      padding: 3px;
      margin-bottom: 28px;
      opacity: 0;
      animation: popIn 0.5s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar svg {
      width: 40px;
      height: 40px;
      fill: var(--accent);
    }

    /* 标题 */
    .title {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.5s 0.2s ease forwards;
    }

    /* 号码 */
    .phone-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      margin-bottom: 40px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.5s 0.28s ease forwards;
    }

    .phone-number .sep {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      margin: 0 4px;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }

    /* 拨号按钮 */
    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 20px 32px;
      border-radius: 60px;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.5s 0.38s ease forwards;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .call-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 50px var(--accent-glow);
    }

    .call-btn:active {
      transform: scale(0.96);
    }

    .call-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
      pointer-events: none;
    }

    .call-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .call-btn .btn-text {
      position: relative;
      z-index: 1;
    }

    /* 呼叫动画 */
    .call-btn.ringing::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 66px;
      border: 2px solid var(--accent);
      animation: ringWave 1.2s ease-out infinite;
    }

    @keyframes ringWave {
      0%   { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    /* 提示 */
    .hint {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.4s 0.5s ease forwards;
    }

    .hint strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* 底部 */
    .footer {
      margin-top: 48px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.4s 0.6s ease forwards;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-glow); }
      50%      { opacity: 0.6; box-shadow: 0 0 0 6px transparent; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 头像图标 -->
    <div class="avatar-ring">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>
      </div>
    </div>

    <!-- 标题 -->
    <div class="title">一键拨号</div>

    <!-- 电话号码 -->
    <div class="phone-number">
      152<span class="sep"></span>9198<span class="sep"></span>9408
    </div>

    <!-- 拨号按钮 —— 核心：href="tel:..." -->
    <a href="tel:15291989408" class="call-btn" id="callBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>
      <span class="btn-text">点击拨打电话</span>
    </a>

    <!-- 提示文字 -->
    <p class="hint">点击上方按钮即可直接跳转至<br><strong>手机拨号界面</strong></p>

    <!-- 底部标识 -->
    <div class="footer">
      <div class="badge">
        <span class="pulse"></span>
        安全通话 · 无需下载
      </div>
    </div>

  </div>

  <script>
    // 拨号按钮点击动画
    var callBtn = document.getElementById('callBtn');
    callBtn.addEventListener('click', function () {
      callBtn.classList.add('ringing');
      setTimeout(function () {
        callBtn.classList.remove('ringing');
      }, 2000);
    });
  </script>

</body>
</html>
