<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>电话号码管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--border:#252530;--accent:#22c55e;--accent-dim:#22c55e18;--accent-glow:#22c55e33;--red:#ef4444;--red-dim:#ef444418;--blue:#3b82f6;--blue-dim:#3b82f618;--yellow:#f59e0b;--yellow-dim:#f59e0b18;--tp:#f0f0f4;--ts:#9a9aaa;--tm:#5a5a68}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--tp);-webkit-font-smoothing:antialiased;min-height:100vh}
    body::before{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);opacity:.3;pointer-events:none}
    body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.02;pointer-events:none}
    @keyframes fU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pI{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    @keyframes fadeI{from{opacity:0}to{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes popToast{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}

    /* ===== 全局操作遮罩 ===== */
    .op-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .op-overlay.show{display:flex;animation:fadeI .15s ease}
    .op-ring{width:44px;height:44px;border:4px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    .op-text{font-size:14px;color:rgba(255,255,255,.6);font-weight:500;letter-spacing:.05em}

    .wrap{max-width:540px;margin:0 auto;padding:20px 16px 80px;position:relative;z-index:1}
    .hd{text-align:center;padding:24px 0 28px;opacity:0;animation:fU .5s .1s ease forwards}
    .hd .ico{width:52px;height:52px;border-radius:14px;background:var(--accent-dim);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
    .hd .ico svg{width:26px;height:26px;fill:var(--accent)}
    .hd h1{font-size:22px;font-weight:700;margin-bottom:4px}
    .st-bar{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:24px;opacity:0;animation:fU .4s .15s ease forwards}
    .st-tag{font-size:11px;color:var(--tm);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;transition:all .15s}
    .st-tag:hover{border-color:var(--accent);color:var(--ts)}
    .st-ok{background:var(--accent-dim)!important;border-color:var(--accent)!important;color:var(--accent)!important}
    .st-err{background:var(--red-dim)!important;border-color:var(--red)!important;color:var(--red)!important}
    .form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;opacity:0;animation:fU .5s .2s ease forwards}
    .form-tl{font-size:14px;font-weight:600;color:var(--ts);letter-spacing:.05em;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .form-tl svg{width:16px;height:16px;fill:var(--accent)}
    .fr{display:flex;gap:10px;margin-bottom:12px}
    .fr:last-child{margin-bottom:0}
    .iw{flex:1}
    .iw label{display:block;font-size:11px;color:var(--tm);margin-bottom:6px;letter-spacing:.05em}
    .iw input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--tp);font-family:'JetBrains Mono','Noto Sans SC',monospace;font-size:14px;outline:none;transition:border-color .2s}
    .iw input:focus{border-color:var(--accent)}.iw input::placeholder{color:var(--tm)}
    .btn-a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;background:var(--accent);color:#0a0a0a;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;white-space:nowrap;align-self:flex-end}
    .btn-a:hover{transform:scale(1.03)}.btn-a:active{transform:scale(.96)}.btn-a svg{width:16px;height:16px}
    .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;opacity:0;animation:fU .4s .3s ease forwards}
    .lh h2{font-size:14px;font-weight:600;color:var(--ts);letter-spacing:.05em}
    .lc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tm);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
    .pl{display:flex;flex-direction:column;gap:10px}
    .pc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;transition:border-color .2s,transform .15s;opacity:0;animation:fU .4s ease forwards}
    .pc:hover{border-color:#333;transform:translateY(-1px)}
    .pc .ci{width:44px;height:44px;border-radius:12px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
    .pc .ci svg{width:20px;height:20px;fill:var(--accent)}.pc .ci img{width:100%;height:100%;object-fit:cover;border-radius:12px}
    .pc .cinf{flex:1;min-width:0}
    .pc .cnm{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pc .cnum{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ts);letter-spacing:.03em}
    .pc .ca{display:flex;gap:6px;flex-shrink:0}
    .bi{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .bi svg{width:16px;height:16px}
    .bi.bq svg{fill:var(--blue)}.bi.bq:hover{background:var(--blue-dim);border-color:var(--blue)}
    .bi.be svg{fill:var(--yellow)}.bi.be:hover{background:var(--yellow-dim);border-color:var(--yellow)}
    .bi.bd svg{fill:var(--red)}.bi.bd:hover{background:var(--red-dim);border-color:var(--red)}
    .empty{text-align:center;padding:60px 20px;opacity:0;animation:fU .5s .3s ease forwards}
    .empty svg{width:56px;height:56px;fill:var(--tm);margin-bottom:16px;opacity:.4}
    .empty h3{font-size:16px;font-weight:500;color:var(--ts);margin-bottom:6px}.empty p{font-size:13px;color:var(--tm)}

    .img-up{position:relative;width:56px;height:56px;border-radius:12px;border:2px dashed var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s;flex-shrink:0;align-self:flex-end}
    .img-up:hover{border-color:var(--accent)}.img-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    .img-up svg.ic{width:22px;height:22px;fill:var(--tm);transition:fill .2s}.img-up:hover svg.ic{fill:var(--accent)}
    .img-up.has img{display:block}.img-up.has svg.ic{display:none}
    .img-up .ix{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;line-height:16px;text-align:center;display:none;z-index:2;border:none;cursor:pointer;padding:0}
    .img-up.has .ix{display:block}

    .search-bar{position:relative;margin-bottom:16px;opacity:0;animation:fU .4s .25s ease forwards}
    .search-bar input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--tp);font-size:13px;outline:none;transition:border-color .2s}
    .search-bar input:focus{border-color:var(--accent)}.search-bar input::placeholder{color:var(--tm)}
    .search-bar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--tm);pointer-events:none;transition:fill .2s}
    .search-bar input:focus~svg{fill:var(--accent)}

    .login-bg{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .login-bg.show{display:flex;animation:fadeI .3s ease}
    .login-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#0d1f14 0%,#0a0a0f 70%)}
    .login-card{position:relative;z-index:1;width:380px;max-width:100%;animation:pI .4s cubic-bezier(.34,1.56,.64,1)}
    .login-logo{text-align:center;margin-bottom:32px}
    .login-logo .lg-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#06b6d4);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 32px #22c55e33}
    .login-logo .lg-icon svg{width:36px;height:36px;fill:#fff}
    .login-logo h2{font-size:26px;font-weight:700;color:var(--tp);margin-bottom:6px}.login-logo p{font-size:13px;color:var(--tm)}
    .login-form{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px}
    .login-form .fi{margin-bottom:16px}.login-form .fi:last-of-type{margin-bottom:24px}
    .login-form .fi label{display:block;font-size:12px;color:var(--ts);margin-bottom:8px;font-weight:500}
    .login-form .fi .fi-wrap{position:relative}
    .login-form .fi .fi-wrap .fi-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--tm);pointer-events:none;transition:fill .2s}
    .login-form .fi input{width:100%;padding:14px 14px 14px 42px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--tp);font-family:'JetBrains Mono','Noto Sans SC',monospace;font-size:14px;outline:none;transition:all .2s}
    .login-form .fi input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .login-form .fi input:focus~.fi-icon{fill:var(--accent)}
    .login-form .fi input::placeholder{color:var(--tm)}
    .login-btn{width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#16a34a);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;transition:all .2s;letter-spacing:.1em;position:relative;overflow:hidden;box-shadow:0 4px 16px #22c55e33}
    .login-btn:hover{transform:translateY(-1px)}.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .login-btn .btn-loading{display:none;align-items:center;justify-content:center;gap:8px}
    .login-btn .btn-loading .dot{width:6px;height:6px;border-radius:50%;background:#fff}
    .login-btn .btn-loading .dot:nth-child(1){animation:dotPulse 1.2s 0s infinite}
    .login-btn .btn-loading .dot:nth-child(2){animation:dotPulse 1.2s .2s infinite}
    .login-btn .btn-loading .dot:nth-child(3){animation:dotPulse 1.2s .4s infinite}
    .login-btn.loading .btn-text{display:none}.login-btn.loading .btn-loading{display:flex}
    .login-err{text-align:center;font-size:13px;color:var(--red);margin-top:12px;min-height:20px}

    .mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .mbg.show{display:flex;animation:fadeI .2s ease}
    .md{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;animation:pI .3s cubic-bezier(.34,1.56,.64,1)}
    .md h3{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center}
    .md .iw{margin-bottom:14px}.md .fr{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
    .ma{display:flex;gap:10px;margin-top:20px}
    .mc{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--ts);font-size:14px;font-weight:500;cursor:pointer}.mc:hover{border-color:var(--tm)}
    .mo{flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#0a0a0a;font-size:14px;font-weight:600;cursor:pointer}.mo:hover{opacity:.9}.mo.red{background:var(--red);color:#fff}

    .qr-overlay{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)}
    .qr-overlay.show{display:flex;animation:fadeI .25s ease}
    .qr-card{position:relative;width:420px;max-width:calc(100vw - 32px);background:#111;border-radius:20px;padding:32px 28px 24px;animation:pI .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .qr-card::before{content:'';position:absolute;inset:0;border-radius:20px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
    .qr-card-body{display:flex;align-items:center;gap:24px}
    .qr-card-left{flex-shrink:0}
    .qr-card-qr{display:inline-block;background:#fff;border-radius:14px;padding:10px;position:relative}
    .qr-card-qr canvas,.qr-card-qr img{border-radius:6px;display:block}
    .qr-card-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;background:#111;border-radius:7px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;overflow:hidden}
    .qr-card-icon svg,.qr-card-icon canvas,.qr-card-icon img{width:100%;height:100%;object-fit:cover}
    .qr-card-right{display:flex;flex-direction:column;gap:8px;margin-left:auto}
    /* 文字美化 */
    .qr-card-text{font-family:'Noto Serif SC',serif;font-size:36px;font-weight:900;color:#ffffff;letter-spacing:.15em;line-height:1.3;white-space:nowrap;text-align:right;text-shadow:0 2px 8px rgba(0,0,0,.5)}
    .qr-card-notice{font-family:'Noto Serif SC',serif;
  font-size:36px;
  font-weight:900;
  color:#ef4444;
  letter-spacing:.12em;
  text-align:center;
  padding:14px 0;
  margin-bottom:20px;
  text-shadow:0 2px 12px rgba(239,68,68,.3);
  white-space:nowrap;}
    .qr-card-actions{display:flex;gap:10px}
    .qr-card-btn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:none}
    .qr-card-btn:active{transform:scale(.97)}
    .qr-card-btn.save{background:#22c55e;color:#fff}.qr-card-btn.save:hover{opacity:.85}
    .qr-card-btn.close{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6)}
    .qr-card-btn.close:hover{border-color:rgba(255,255,255,.3);color:#fff}

    .loading{text-align:center;padding:40px;color:var(--tm);font-size:13px;opacity:0;animation:fU .4s .3s ease forwards}
    .loading .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px 36px;font-size:16px;font-weight:600;color:var(--tp);z-index:999;display:none;box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 20px var(--accent-glow);white-space:nowrap;text-align:center;min-width:220px;backdrop-filter:blur(12px)}
    .toast.show{display:block;animation:popToast .35s cubic-bezier(.34,1.56,.64,1)}
    .toast.success{border-color:var(--accent);color:var(--accent)}.toast.error{border-color:var(--red);color:var(--red)}.toast.warn{border-color:var(--yellow);color:var(--yellow)}

    @media(max-width:520px){
      .fr{flex-direction:column}.btn-a{width:100%}.md{padding:24px 20px}
      .login-card{width:100%}.login-form{padding:24px 20px}
      .qr-card{width:calc(100vw - 40px);padding:24px 20px 20px}
      .qr-card-body{flex-direction:column;gap:16px;align-items:center}
      .qr-card-right{align-items:flex-end}.qr-card-text{font-size:28px;letter-spacing:.1em}.qr-card-notice{font-size:28px}
    }
  </style>
</head>
<body>

<!-- 操作遮罩 -->
<div class="op-overlay" id="opOverlay"><div class="op-ring"></div><div class="op-text" id="opText">处理中...</div></div>

<div class="wrap" id="app">
  <div class="hd"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg></div><h1>电话号码管理</h1></div>
  <div class="st-bar"><span class="st-tag" id="stTag" onclick="openLogin()">&#9881; 系统配置</span></div>
  <div class="form" id="addForm">
    <div class="form-tl"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>添加新号码</div>
    <div class="fr"><div class="iw"><label>电话号码 *</label><input type="tel" id="inpPhone" placeholder="例如 15291989408" maxlength="20"></div><div class="iw"><label>备注名称</label><input type="text" id="inpName" placeholder="例如 张先生" maxlength="20"></div></div>
    <div class="fr">
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px"><label style="font-size:11px;color:var(--tm);letter-spacing:.05em">车标图片</label><div class="img-up" id="addImgUp" onclick="$('addImgFile').click()"><img id="addImgPreview"><svg class="ic" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><button class="ix" onclick="event.stopPropagation();clearImg('add')">&times;</button></div><input type="file" id="addImgFile" accept="image/*" style="display:none"></div>
      <button class="btn-a" onclick="addPhone()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>添加号码</button>
    </div>
  </div>
  <div class="lh" id="listHead"><h2>已保存的号码</h2><span class="lc" id="listCnt">0 个</span></div>
  <div class="search-bar" id="searchBar" style="display:none"><input type="text" id="searchInput" placeholder="搜索号码或备注..." oninput="render()"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>
  <div class="pl" id="phoneList"><div class="loading"><div class="spinner"></div>加载中...</div></div>
</div>

<div class="login-bg" id="loginModal"><div class="login-card"><div class="login-logo"><div class="lg-icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg></div><h2>电话号码管理</h2><p>请登录以继续使用</p></div><div class="login-form"><div class="fi"><label>管理员账号</label><div class="fi-wrap"><input type="text" id="cfgOwner" placeholder="请输入用户名"><svg class="fi-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div></div><div class="fi"><label>密码</label><div class="fi-wrap"><input type="password" id="cfgToken" placeholder="请输入密码"><svg class="fi-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div></div><div class="login-err" id="loginErr"></div><button class="login-btn" id="loginBtn" onclick="doLogin()"><span class="btn-text">登 录</span><span class="btn-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></button></div></div></div>

<div class="mbg" id="editModal"><div class="md"><h3>编辑号码</h3><div class="fr"><div class="iw"><label>电话号码</label><input type="tel" id="edPhone" maxlength="20"></div><div class="iw"><label>备注名称</label><input type="text" id="edName" maxlength="20"></div></div><div class="fr" style="justify-content:flex-start"><div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px"><label style="font-size:11px;color:var(--tm);letter-spacing:.05em">车标图片</label><div class="img-up" id="edImgUp" onclick="$('edImgFile').click()"><img id="edImgPreview"><svg class="ic" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><button class="ix" onclick="event.stopPropagation();clearImg('ed')">&times;</button></div><input type="file" id="edImgFile" accept="image/*" style="display:none"></div></div><div class="ma"><button class="mc" onclick="closeM('editModal')">取消</button><button class="mo" onclick="saveEdit()">保存</button></div></div></div>

<div class="mbg" id="delModal"><div class="md"><h3>确认删除</h3><p id="delInfo" style="text-align:center;color:var(--ts);font-size:14px;margin-bottom:4px"></p><p style="text-align:center;color:var(--tm);font-size:12px">删除后对应二维码将失效</p><div class="ma"><button class="mc" onclick="closeM('delModal')">取消</button><button class="mo red" onclick="confirmDel()">删除</button></div></div></div>

<div class="qr-overlay" id="qrModal">
  <div class="qr-card">
    <div class="qr-card-body">
      <div class="qr-card-left"><div class="qr-card-qr"><div id="qrBox"></div><div class="qr-card-icon" id="qrDomIcon"></div></div></div>
      <div class="qr-card-right"><div class="qr-card-text">手机扫码</div><div class="qr-card-text">呼叫车主</div></div>
    </div>
    <div class="qr-card-notice">临时停车，敬请谅解</div>
    <div class="qr-card-actions">
      <button class="qr-card-btn save" onclick="dlQrCard()">下载图片</button>
      <button class="qr-card-btn close" onclick="closeM('qrModal')">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var REPO_NAME='call-page';
var cfg=JSON.parse(localStorage.getItem('ghCfg')||'{}');
var SHA=null,DATA=null,configured=false;
var currentQrItem=null;
var addImgData=null,edImgData=null,edImgChanged=false;

function $(id){return document.getElementById(id)}
function closeM(id){$(id).classList.remove('show')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmt(n){var d=n.replace(/\D/g,'');if(d.length===11)return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7);return n}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m,type){var t=$('toast');t.textContent=m;t.className='toast show '+(type||'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast'},2500)}
function b64Decode(str){try{return decodeURIComponent(atob(str).split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)}).join(''))}catch(e){return atob(str)}}
function b64Encode(str){return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,function(m,p){return String.fromCharCode('0x'+p)}))}
function hidePage(){$('addForm').style.display='none';$('listHead').style.display='none';$('searchBar').style.display='none';$('phoneList').style.display='none'}
function showPage(){$('addForm').style.display='';$('listHead').style.display='';$('searchBar').style.display='';$('phoneList').style.display=''}
function iconUrl(p){return p?'https://'+cfg.owner+'.github.io/'+REPO_NAME+'/'+p+'?t='+Date.now():null}
function apiUrl(p){return 'https://api.github.com/repos/'+cfg.owner+'/'+REPO_NAME+'/contents/'+p}

/* ===== 操作遮罩 ===== */
function showOp(msg){$('opText').textContent=msg||'处理中...';$('opOverlay').classList.add('show')}
function hideOp(){$('opOverlay').classList.remove('show')}

/* ===== 图片处理 ===== */
function resizeImg(file,cb){
  var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var w=img.width,h=img.height,sz=Math.min(w,h);c.width=100;c.height=100;c.getContext('2d').drawImage(img,(w-sz)/2,(h-sz)/2,sz,sz,0,0,100,100);cb(c.toDataURL('image/png'))};img.src=e.target.result};r.readAsDataURL(file);
}
function setImgPreview(prefix,data){var up=$(prefix+'ImgUp'),pre=$(prefix+'ImgPreview');if(data){pre.src=data;up.classList.add('has')}else{pre.src='';up.classList.remove('has')}}
function clearImg(prefix){if(prefix==='add')addImgData=null;else{edImgData=null;edImgChanged=true}$(prefix+'ImgFile').value='';setImgPreview(prefix,null)}
function initImgFile(prefix){$(prefix+'ImgFile').onchange=function(){var f=this.files[0];if(!f)return;resizeImg(f,function(data){if(prefix==='add')addImgData=data;else{edImgData=data;edImgChanged=true}setImgPreview(prefix,data)})}}

/* ===== GitHub API ===== */
async function ghGet(path){var r=await fetch(apiUrl(path),{headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json'}});if(r.status===401)throw new Error('TOKEN_INVALID');if(r.status===403)throw new Error('TOKEN_NO_permission');if(r.status===404)return null;if(!r.ok)throw new Error('GET failed:'+r.status);var d=await r.json();return{content:JSON.parse(b64Decode(d.content)),sha:d.sha}}
async function ghPut(path,content,sha,msg){var b={message:msg||'Update',content:b64Encode(JSON.stringify(content,null,2))};if(sha)b.sha=sha;var r=await fetch(apiUrl(path),{method:'PUT',headers:{'Authorization':'token '+cfg.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(b)});if(r.status===401)throw new Error('TOKEN_INVALID');if(r.status===403)throw new Error('TOKEN_NO_permission');if(!r.ok)throw new Error('PUT failed:'+r.status);return(await r.json()).content.sha}
async function getFileSHA(path){var r=await fetch(apiUrl(path),{headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json'}});if(r.status===404)return null;if(!r.ok)return null;return(await r.json()).sha}
async function uploadIconFile(path,dataUrl,msg){var base64=dataUrl.split(',')[1];var sha=await getFileSHA(path);var b={message:msg||'Upload icon',content:base64};if(sha)b.sha=sha;var r=await fetch(apiUrl(path),{method:'PUT',headers:{'Authorization':'token '+cfg.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(b)});if(r.status===401)throw new Error('TOKEN_INVALID');if(r.status===403)throw new Error('TOKEN_NO_permission');if(!r.ok)throw new Error('Upload failed:'+r.status)}
async function deleteIconFile(path,msg){var sha=await getFileSHA(path);if(!sha)return;await fetch(apiUrl(path),{method:'DELETE',headers:{'Authorization':'token '+cfg.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({message:msg||'Delete icon',sha:sha})})}

/* ===== 登录 ===== */
function openLogin(){$('cfgOwner').value=cfg.owner||'';$('cfgToken').value=cfg.token||'';$('loginErr').textContent='';$('loginBtn').disabled=false;$('loginBtn').classList.remove('loading');$('loginModal').classList.add('show');setTimeout(function(){$('cfgOwner').focus()},300)}
async function doLogin(){var o=$('cfgOwner').value.trim(),t=$('cfgToken').value.trim();if(!o){$('loginErr').textContent='请输入用户名';return}if(!t){$('loginErr').textContent='请输入密码';return}$('loginErr').textContent='';$('loginBtn').disabled=true;$('loginBtn').classList.add('loading');try{var c=new AbortController(),tm=setTimeout(function(){c.abort()},15000);var r=await fetch('https://api.github.com/repos/'+o+'/'+REPO_NAME,{headers:{'Authorization':'token '+t},signal:c.signal});clearTimeout(tm);if(r.ok){cfg={owner:o,token:t};localStorage.setItem('ghCfg',JSON.stringify(cfg));$('loginModal').classList.remove('show');toast('登录成功','success');loadData()}else if(r.status===401){$('loginErr').textContent='密码错误'}else if(r.status===404){$('loginErr').textContent='用户名不存在'}else{$('loginErr').textContent='连接失败('+r.status+')'}}catch(e){$('loginErr').textContent=e.name==='AbortError'?'网络超时':'网络异常'}finally{$('loginBtn').disabled=false;$('loginBtn').classList.remove('loading')}}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('loginModal').classList.contains('show')){if(document.activeElement===$('cfgOwner'))$('cfgToken').focus();else if(document.activeElement===$('cfgToken'))doLogin()}});

/* ===== 数据 ===== */
async function loadData(){hidePage();try{var r=await ghGet('phones.json');if(r){DATA=r.content;SHA=r.sha}else{DATA={phones:[]};SHA=null}configured=true;$('stTag').textContent='已连接';$('stTag').className='st-tag st-ok';showPage();render()}catch(e){configured=false;if(e.message==='TOKEN_INVALID'||e.message==='TOKEN_NO_permission'){$('stTag').textContent='请登录';$('stTag').className='st-tag st-err';toast('请重新登录','error');hidePage();openLogin()}else{$('stTag').textContent='加载失败';$('stTag').className='st-tag st-err';showPage();$('phoneList').innerHTML='<div class="empty"><h3>加载失败</h3><p>'+esc(e.message)+'</p></div>'}}}
async function saveData(action){try{SHA=await ghPut('phones.json',DATA,SHA,action);render();return true}catch(e){if(e.message==='TOKEN_INVALID'||e.message==='TOKEN_NO_permission'){configured=false;$('stTag').textContent='请登录';$('stTag').className='st-tag st-err';toast('请重新登录','error');hidePage();openLogin()}else toast('保存失败','error');return false}}

/* ===== 添加（带遮罩） ===== */
async function addPhone(){
  if(!cfg.token){openLogin();return}
  var p=$('inpPhone').value.trim(),n=$('inpName').value.trim();
  if(!p){toast('请输入电话号码','warn');$('inpPhone').focus();$('inpPhone').style.animation='shake .4s';setTimeout(function(){$('inpPhone').style.animation=''},400);return}
  showOp('添加号码中...');
  try{
    var id=uid();
    if(addImgData){await uploadIconFile('icons/'+id+'.png',addImgData,'上传车标 '+n||p)}
    if(!DATA)DATA={phones:[]};
    var item={id:id,phone:p,name:n,created:new Date().toISOString()};
    if(addImgData)item.icon='icons/'+id+'.png';
    DATA.phones.push(item);
    if(await saveData('添加号码 '+fmt(p))){
      $('inpPhone').value='';$('inpName').value='';addImgData=null;setImgPreview('add',null);
      toast('添加成功','success');
    }
  }catch(e){toast('操作失败: '+e.message,'error')}
  finally{hideOp()}
}

/* ===== 编辑（带遮罩） ===== */
var edId=null;
function openEdit(id){edId=id;var it=DATA.phones.find(function(x){return x.id===id});if(!it)return;$('edPhone').value=it.phone;$('edName').value=it.name;edImgData=it.icon?iconUrl(it.icon):null;edImgChanged=false;setImgPreview('ed',edImgData);$('editModal').classList.add('show')}
async function saveEdit(){
  var p=$('edPhone').value.trim(),n=$('edName').value.trim();
  if(!p){toast('号码不能为空','warn');return}
  var it=DATA.phones.find(function(x){return x.id===edId});if(!it)return;
  showOp('保存中...');
  try{
    if(edImgChanged){
      if(edImgData&&edImgData.startsWith('data:')){await uploadIconFile('icons/'+edId+'.png',edImgData,'更新车标');it.icon='icons/'+edId+'.png'}
      else{if(it.icon)await deleteIconFile(it.icon,'删除车标');delete it.icon}
    }
    it.phone=p;it.name=n;
    if(await saveData('修改号码 '+fmt(p))){closeM('editModal');toast('修改成功','success')}
  }catch(e){toast('操作失败: '+e.message,'error')}
  finally{hideOp()}
}

/* ===== 删除（带遮罩） ===== */
var delId=null;
function openDel(id){delId=id;var it=DATA.phones.find(function(x){return x.id===id});if(!it)return;$('delInfo').textContent=(it.name?it.name+' - ':'')+fmt(it.phone);$('delModal').classList.add('show')}
async function confirmDel(){
  var it=DATA.phones.find(function(x){return x.id===delId});
  showOp('删除中...');
  try{
    if(it&&it.icon)await deleteIconFile(it.icon,'删除车标');
    DATA.phones=DATA.phones.filter(function(x){return x.id!==delId});
    if(await saveData('删除号码 '+(it?fmt(it.phone):''))){closeM('delModal');toast('已删除','success')}
  }catch(e){toast('操作失败: '+e.message,'error')}
  finally{hideOp()}
}

function baseUrl(){return 'https://'+cfg.owner+'.github.io/'+REPO_NAME+'/call.html'}

/* ===== 默认小汽车 ===== */
function drawDefaultCar(ctx,x,y,size){
  var s=size*.42;ctx.save();ctx.fillStyle='#22c55e';ctx.beginPath();
  ctx.moveTo(x-s,y+s*.3);ctx.lineTo(x-s*.7,y-s*.5);ctx.quadraticCurveTo(x-s*.4,y-s*.9,x,y-s*.8);
  ctx.quadraticCurveTo(x+s*.4,y-s*.9,x+s*.7,y-s*.5);ctx.lineTo(x+s,y+s*.3);ctx.lineTo(x+s,y+s*.5);
  ctx.lineTo(x-s,y+s*.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-s*.6,y+s*.5,s*.25,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+s*.6,y+s*.5,s*.25,0,Math.PI*2);ctx.fill();ctx.restore();
}

/* ===== 二维码弹框 ===== */
function showQr(id){
  var it=DATA.phones.find(function(x){return x.id===id});if(!it)return;
  currentQrItem=it;
  var box=$('qrBox');box.innerHTML='';
  new QRCode(box,{text:baseUrl()+'?id='+id,width:110,height:110,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  var el=$('qrDomIcon');
  if(it.icon){
    var img=document.createElement('img');img.src=iconUrl(it.icon);
    img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:6px';
    img.onerror=function(){var c=document.createElement('canvas');c.width=80;c.height=80;c.style.cssText='width:100%;height:100%';drawDefaultCar(c.getContext('2d'),40,40,80);el.innerHTML='';el.appendChild(c)};
    el.innerHTML='';el.appendChild(img);
  }else{var c=document.createElement('canvas');c.width=80;c.height=80;c.style.cssText='width:100%;height:100%';drawDefaultCar(c.getContext('2d'),40,40,80);el.innerHTML='';el.appendChild(c)}
  $('qrModal').classList.add('show');
}

/* ===== 下载图片（白色文字 + 字体美化） ===== */
function dlQrCard(){
  var item=currentQrItem;
  if(item&&item.icon){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){dlQrCardDraw(img)};img.onerror=function(){dlQrCardDraw(null)};img.src=iconUrl(item.icon)}
  else dlQrCardDraw(null);
}

function dlQrCardDraw(customImg){
  var S=2,cw=420,pt=32,pr=28,pl=28;
  var qrDraw=110,qrPad=10,textGap=8,fs=36,nPad=14;
  var qrOuter=(qrDraw+qrPad*2)*S,lineH=fs*1.3*S,textBlockH=lineH*2+textGap*S;
  var bodyH=Math.max(qrOuter,textBlockH),noticeH=fs*S;
  var topPad=pt*S,bottomPad=pt*S;
  var cW=cw*S,cH=topPad+bodyH+nPad*S+noticeH+bottomPad;
  cH=Math.ceil(cH/2)*2;
  var canvas=document.createElement('canvas');canvas.width=cW;canvas.height=cH;
  var ctx=canvas.getContext('2d'),W=cW,H=cH;
  var qrCanvas=$('qrBox').querySelector('canvas');
  if(!qrCanvas){toast('二维码未加载','error');return}

  var leftEdge=pl*S,rightEdge=W-pr*S,bodyTop=topPad;
  var qrX=leftEdge,qrY=bodyTop+(bodyH-qrOuter)/2;

  // 白色二维码框
  ctx.fillStyle='#fff';drawRR(ctx,qrX,qrY,qrOuter,qrOuter,14*S);ctx.fill();
  ctx.drawImage(qrCanvas,qrX+qrPad*S,qrY+qrPad*S,qrDraw*S,qrDraw*S);

  // 中心图标
  var icS=30*S,icX=qrX+(qrOuter-icS)/2,icY=qrY+(qrOuter-icS)/2;
  ctx.fillStyle='#fff';drawRR(ctx,icX,icY,icS,icS,6*S);ctx.fill();
  ctx.save();drawRR(ctx,icX,icY,icS,icS,6*S);ctx.clip();
  if(customImg)ctx.drawImage(customImg,icX,icY,icS,icS);
  else drawDefaultCar(ctx,icX+icS/2,icY+icS/2,icS);
  ctx.restore();

  // 文字 — 白色 + 阴影美化
  var textStartY=bodyTop+(bodyH-textBlockH)/2;
  var txtFont='900 '+fs*S+'px "Noto Serif SC", serif';
  ctx.font=txtFont;ctx.textAlign='right';ctx.textBaseline='middle';
  // 阴影
  ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=10;ctx.shadowOffsetX=0;ctx.shadowOffsetY=3;
  ctx.fillStyle='#ffffff';
  ctx.fillText('手机扫码',rightEdge,textStartY+lineH/2);
  ctx.fillText('呼叫车主',rightEdge,textStartY+lineH+textGap*S+lineH/2);
  // 重置阴影
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  // 警示语 — 红色 + 光晕
  var noticeTop=bodyTop+bodyH+nPad*S,noticeY=noticeTop+noticeH/2;
  ctx.fillStyle='#ef4444';ctx.font='900 '+fs*S+'px "Noto Serif SC", serif';
  ctx.shadowColor='rgba(239,68,68,0.3)';ctx.shadowBlur=12;ctx.shadowOffsetY=2;
  var ntxt='临时停车，敬请谅解',chars=ntxt.split('');
  var cws=chars.map(function(c){return ctx.measureText(c).width});
  var tw=rightEdge-leftEdge,sb=chars.length>1?(tw-cws.reduce(function(a,b){return a+b},0))/(chars.length-1):0;
  var cx=leftEdge;
  for(var i=0;i<chars.length;i++){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(chars[i],cx,noticeY);cx+=cws[i]+sb}
  ctx.shadowColor='transparent';ctx.shadowBlur=0;

  var a=document.createElement('a');a.download='挪车二维码.png';a.href=canvas.toDataURL('image/png');a.click();
  toast('图片已下载，可直接打印','success');
}

function drawRR(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

/* ===== 渲染 ===== */
function render(){
  var list=DATA?DATA.phones:[];var q=($('searchInput').value||'').trim().toLowerCase();
  var filtered=q?list.filter(function(it){return it.phone.indexOf(q)!==-1||(it.name&&it.name.toLowerCase().indexOf(q)!==-1)}):list;
  $('listCnt').textContent=list.length+' 个';
  if(!list.length){$('phoneList').innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg><h3>还没有号码</h3><p>在上方输入电话号码添加</p></div>';return}
