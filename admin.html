<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电话二维码</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #13131a;
      --border: #252530;
      --accent: #22c55e;
      --accent-glow: #22c55e33;
      --text-primary: #f0f0f4;
      --text-secondary: #9a9aaa;
      --text-muted: #5a5a68;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.4;
      pointer-events: none;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
      50%      { opacity: 0.5; transform: translateX(-50%) scale(1.1); }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 90vw;
      position: relative;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent-glow), transparent 50%, #22c55e11);
      z-index: -1;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      opacity: 0;
      animation: fadeUp 0.5s 0.2s ease forwards;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      opacity: 0;
      animation: fadeUp 0.5s 0.25s ease forwards;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s ease forwards;
    }

    .qr-wrap {
      display: inline-block;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      position: relative;
      margin-bottom: 24px;
      opacity: 0;
      animation: popIn 0.6s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .qr-wrap::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 26px;
      border: 1px dashed var(--border);
      pointer-events: none;
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img, #qrcode canvas {
      border-radius: 6px;
    }

    .url-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.4s 0.55s ease forwards;
    }

    .steps {
      text-align: left;
      opacity: 0;
      animation: fadeUp 0.4s 0.65s ease forwards;
    }

    .steps h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #0a0a0a;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding-top: 2px;
    }

    .step-text strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 20px auto;
      opacity: 0;
      animation: fadeUp 0.4s 0.6s ease forwards;
    }

    .footer {
      margin-top: 24px;
      opacity: 0;
      animation: fadeUp 0.4s 0.75s ease forwards;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">PHONE QR CODE</div>
    <div class="title">扫码拨打电话</div>
    <div class="subtitle">152 9198 9408</div>

    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>

    <div class="url-box" id="urlBox"></div>

    <div class="divider"></div>

    <div class="steps">
      <h3>使用说明</h3>
      <div class="step">
        <span class="step-num">1</span>
        <span class="step-text"><strong>微信扫一扫</strong>扫描此二维码</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span class="step-text">在打开的页面中<strong>点击拨打按钮</strong></span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span class="step-text">自动跳转至<strong>手机拨号界面</strong></span>
      </div>
    </div>

    <div class="footer">
      <div class="badge">
        <span class="dot"></span>
        微信 · 浏览器 · 系统相机 均可扫码
      </div>
    </div>
  </div>

  <script>
    // ====== 请确认你的仓库名，修改下面这行 ======
    var REPO_NAME = "call-page";
    // =============================================
    var USERNAME = "lsxun";
    var TARGET_URL = "https://" + USERNAME + ".github.io/" + REPO_NAME + "/";

    document.getElementById("urlBox").textContent = TARGET_URL;

    new QRCode(document.getElementById("qrcode"), {
      text: TARGET_URL,
      width: 240,
      height: 240,
      colorDark: "#13131a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>

</body>
</html>
