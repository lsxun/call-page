<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>电话号码管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface-2: #1a1a24;
      --border: #252530;
      --accent: #22c55e;
      --accent-dim: #22c55e22;
      --accent-glow: #22c55e33;
      --red: #ef4444;
      --red-dim: #ef444422;
      --blue: #3b82f6;
      --blue-dim: #3b82f622;
      --text-primary: #f0f0f4;
      --text-secondary: #9a9aaa;
      --text-muted: #5a5a68;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      animation: breathe 5s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.02;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.2; transform: translateX(-50%) scale(1); }
      50%      { opacity: 0.4; transform: translateX(-50%) scale(1.1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============ 拨号页面样式 ============ */
    #callPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
      position: relative;
      z-index: 1;
    }

    .call-avatar-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      padding: 3px;
      margin-bottom: 24px;
      opacity: 0;
      animation: popIn 0.5s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .call-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .call-avatar svg { width: 40px; height: 40px; fill: var(--accent); }

    .call-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeUp 0.5s 0.2s ease forwards;
    }

    .call-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.5s 0.25s ease forwards;
    }

    .call-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s ease forwards;
    }

    .call-number .sep {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      margin: 0 4px;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }

    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 340px;
      padding: 20px 32px;
      border-radius: 60px;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.5s 0.4s ease forwards;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .call-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 50px var(--accent-glow);
    }

    .call-btn:active { transform: scale(0.96); }

    .call-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
      pointer-events: none;
    }

    .call-btn svg { width: 24px; height: 24px; flex-shrink: 0; position: relative; z-index: 1; }
    .call-btn .btn-text { position: relative; z-index: 1; }

    .call-btn.ringing::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 66px;
      border: 2px solid var(--accent);
      animation: ringWave 1.2s ease-out infinite;
    }

    @keyframes ringWave {
      0%   { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .call-hint {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.4s 0.5s ease forwards;
    }

    .call-hint strong { color: var(--text-primary); font-weight: 500; }

    /* ============ 管理页面样式 ============ */
    #adminPage {
      display: none;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      position: relative;
      z-index: 1;
    }

    .admin-header {
      text-align: center;
      padding: 20px 0 32px;
      opacity: 0;
      animation: fadeUp 0.5s 0.1s ease forwards;
    }

    .admin-header .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .admin-header .logo-icon svg { width: 24px; height: 24px; fill: var(--accent); }

    .admin-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .admin-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* 添加表单 */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 0.5s 0.2s ease forwards;
    }

    .form-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-title svg { width: 16px; height: 16px; fill: var(--accent); }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-row:last-child { margin-bottom: 0; }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    .input-wrap label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrap input:focus { border-color: var(--accent); }

    .input-wrap input::placeholder { color: var(--text-muted); }

    .btn-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      white-space: nowrap;
      align-self: flex-end;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-add:hover { transform: scale(1.03); }
    .btn-add:active { transform: scale(0.96); }
    .btn-add svg { width: 16px; height: 16px; }

    /* 号码列表 */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.4s 0.3s ease forwards;
    }

    .list-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .list-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
    }

    .phone-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .phone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, transform 0.15s;
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
    }

    .phone-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .phone-card .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .phone-card .card-icon svg { width: 20px; height: 20px; fill: var(--accent); }

    .phone-card .card-info { flex: 1; min-width: 0; }

    .phone-card .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phone-card .card-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }

    .phone-card .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-icon svg { width: 16px; height: 16px; }

    .btn-icon.btn-qr { }
    .btn-icon.btn-qr svg { fill: var(--blue); }
    .btn-icon.btn-qr:hover { background: var(--blue-dim); border-color: var(--blue); }

    .btn-icon.btn-link svg { fill: var(--accent); }
    .btn-icon.btn-link:hover { background: var(--accent-dim); border-color: var(--accent); }

    .btn-icon.btn-del svg { fill: var(--red); }
    .btn-icon.btn-del:hover { background: var(--red-dim); border-color: var(--red); }

    .btn-icon.btn-edit svg { fill: #f59e0b; }
    .btn-icon.btn-edit:hover { background: #f59e0b22; border-color: #f59e0b; }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s ease forwards;
    }

    .empty-state svg { width: 56px; height: 56px; fill: var(--text-muted); margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { font-size: 16px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: var(--text-muted); }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal .input-wrap { margin-bottom: 14px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions .btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-actions .btn-cancel:hover { border-color: var(--text-muted); }

    .modal-actions .btn-confirm {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-actions .btn-confirm:hover { opacity: 0.9; }

    .modal-actions .btn-confirm.danger { background: var(--red); }

    /* QR 弹窗 */
    .qr-modal .qr-display {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .qr-modal .qr-display .qr-box {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
    }

    .qr-modal .qr-url {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      word-break: break-all;
      text-align: center;
      margin-bottom: 8px;
    }

    .qr-modal .qr-tip {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn-download {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--blue);
      color: #fff;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 10px;
    }

    .btn-download:hover { opacity: 0.85; }

    .btn-close {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-close:hover { border-color: var(--text-muted); }

    /* toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 13px;
      color: var(--text-primary);
      z-index: 300;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      white-space: nowrap;
    }

    .toast.show {
      display: block;
      animation: slideUp 0.3s ease, fadeIn 0.3s ease;
    }

    /* ============ 响应式 ============ */
    @media (max-width: 480px) {
      .form-row { flex-direction: column; }
      .btn-add { width: 100%; }
      .modal { padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <!-- ============ 拨号页面 ============ -->
  <div id="callPage">
    <div class="call-avatar-ring">
      <div class="call-avatar">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>
      </div>
    </div>
    <div class="call-label" id="callLabel">一键拨号</div>
    <div class="call-name" id="callName" style="display:none"></div>
    <div class="call-number" id="callNumber"></div>
    <a class="call-btn" id="callBtn" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>
      <span class="btn-text">点击拨打电话</span>
    </a>
    <p class="call-hint">点击上方按钮跳转至<strong>手机拨号界面</strong></p>
  </div>

  <!-- ============ 管理页面 ============ -->
  <div id="adminPage">
    <div class="admin-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>
      </div>
      <h1>电话号码管理</h1>
      <p>添加号码并为每个号码生成独立二维码</p>
    </div>

    <!-- 添加表单 -->
    <div class="add-form">
      <div class="form-title">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        添加新号码
      </div>
      <div class="form-row">
        <div class="input-wrap">
          <label>电话号码 *</label>
          <input type="tel" id="inputPhone" placeholder="例如 15291989408" maxlength="20">
        </div>
        <div class="input-wrap">
          <label>备注名称</label>
          <input type="text" id="inputName" placeholder="例如 张先生" maxlength="20">
        </div>
      </div>
      <div class="form-row">
        <button class="btn-add" id="btnAdd">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          添加号码
        </button>
      </div>
    </div>

    <!-- 列表 -->
    <div class="list-header">
      <h2>已保存的号码</h2>
      <span class="list-count" id="listCount">0 个</span>
    </div>
    <div class="phone-list" id="phoneList"></div>
  </div>

  <!-- ============ 编辑弹窗 ============ -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>编辑号码</h3>
      <div class="input-wrap">
        <label>电话号码</label>
        <input type="tel" id="editPhone" maxlength="20">
      </div>
      <div class="input-wrap">
        <label>备注名称</label>
        <input type="text" id="editName" maxlength="20">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="editCancel">取消</button>
        <button class="btn-confirm" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 删除确认弹窗 ============ -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>确认删除</h3>
      <p style="text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:4px;" id="deleteInfo"></p>
      <p style="text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:8px;">删除后对应二维码将失效</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="deleteCancel">取消</button>
        <button class="btn-confirm danger" id="deleteConfirm">删除</button>
      </div>
    </div>
  </div>

  <!-- ============ 二维码弹窗 ============ -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal qr-modal">
      <h3 id="qrTitle">二维码</h3>
      <div class="qr-display">
        <div class="qr-box" id="qrBox"></div>
      </div>
      <div class="qr-url" id="qrUrl"></div>
      <p class="qr-tip">微信 / 浏览器 / 相机 扫码即可拨号</p>
      <button class="btn-download" id="btnDownload">保存二维码图片</button>
      <button class="btn-close" id="qrClose">关闭</button>
    </div>
  </div>

  <!-- ============ Toast ============ -->
  <div class="toast" id="toast"></div>

  <script>
    // ====== 配置 ======
    var SITE_BASE = location.origin + location.pathname;

    // ====== 数据管理 ======
    function getPhones() {
      try { return JSON.parse(localStorage.getItem('phones') || '[]'); }
      catch(e) { return []; }
    }

    function savePhones(list) {
      localStorage.setItem('phones', JSON.stringify(list));
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // ====== Toast ======
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    // ====== 拨号格式化 ======
    function formatPhone(num) {
      var d = num.replace(/\D/g, '');
      if (d.length === 11) {
        return d.slice(0,3) + ' ' + d.slice(3,7) + ' ' + d.slice(7);
      }
      return num;
    }

    // ====== 路由判断 ======
    var params = new URLSearchParams(location.search);
    var callId = params.get('id');

    if (callId) {
      showCallPage(callId);
    } else {
      showAdminPage();
    }

    // ============ 拨号页面逻辑 ============
    function showCallPage(id) {
      document.getElementById('callPage').style.display = 'flex';
      var phones = getPhones();
      var item = phones.find(function(p) { return p.id === id; });

      if (item) {
        document.getElementById('callName').textContent = item.name;
        document.getElementById('callName').style.display = 'block';
        document.getElementById('callLabel').textContent = '一键拨号';
        document.getElementById('callNumber').innerHTML = formatPhone(item.phone).replace(/ /g, '<span class="sep"></span>');
        document.getElementById('callBtn').href = 'tel:' + item.phone;
        document.title = '拨打电话 - ' + (item.name || item.phone);
      } else {
        // 如果找不到记录，尝试用 id 作为电话号码（兼容直接传号码的情况）
        var phone = id.replace(/\D/g, '');
        if (phone.length >= 5) {
          document.getElementById('callNumber').innerHTML = formatPhone(phone).replace(/ /g, '<span class="sep"></span>');
          document.getElementById('callBtn').href = 'tel:' + phone;
          document.title = '拨打电话 - ' + phone;
        }
      }

      document.getElementById('callBtn').addEventListener('click', function() {
        this.classList.add('ringing');
        var self = this;
        setTimeout(function() { self.classList.remove('ringing'); }, 2000);
      });
    }

    // ============ 管理页面逻辑 ============
    function showAdminPage() {
      document.getElementById('adminPage').style.display = 'block';
      renderList();

      // 添加
      document.getElementById('btnAdd').addEventListener('click', addPhone);
      document.getElementById('inputPhone').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addPhone();
      });

      // 编辑弹窗
      document.getElementById('editCancel').addEventListener('click', function() {
        document.getElementById('editModal').classList.remove('show');
      });
      document.getElementById('editSave').addEventListener('click', saveEdit);

      // 删除弹窗
      document.getElementById('deleteCancel').addEventListener('click', function() {
        document.getElementById('deleteModal').classList.remove('show');
      });
      document.getElementById('deleteConfirm').addEventListener('click', confirmDelete);

      // QR 弹窗
      document.getElementById('qrClose').addEventListener('click', function() {
        document.getElementById('qrModal').classList.remove('show');
      });
      document.getElementById('btnDownload').addEventListener('click', downloadQr);
    }

    // 添加号码
    function addPhone() {
      var phone = document.getElementById('inputPhone').value.trim();
      var name = document.getElementById('inputName').value.trim();

      if (!phone) {
        toast('请输入电话号码');
        document.getElementById('inputPhone').focus();
        document.getElementById('inputPhone').style.animation = 'shake 0.4s';
        setTimeout(function() { document.getElementById('inputPhone').style.animation = ''; }, 400);
        return;
      }

      var list = getPhones();
      list.push({ id: genId(), phone: phone, name: name || '' });
      savePhones(list);

      document.getElementById('inputPhone').value = '';
      document.getElementById('inputName').value = '';
      renderList();
      toast('添加成功');
    }

    // 渲染列表
    function renderList() {
      var list = getPhones();
      var container = document.getElementById('phoneList');
      var countEl = document.getElementById('listCount');
      countEl.textContent = list.length + ' 个';

      if (list.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg>' +
            '<h3>还没有号码</h3>' +
            '<p>在上方输入电话号码添加</p>' +
          '</div>';
        return;
      }

      var html = '';
      list.forEach(function(item, i) {
        var display = item.name ? item.name : '未命名';
        var delay = Math.min(i * 0.06, 0.4);
        html +=
          '<div class="phone-card" style="animation-delay:' + delay + 's">' +
            '<div class="card-icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.01-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.1.31.03.66-.25 1.02l-2.2 2.2z"/></svg></div>' +
            '<div class="card-info">' +
              '<div class="card-name">' + escHtml(display) + '</div>' +
              '<div class="card-number">' + escHtml(formatPhone(item.phone)) + '</div>' +
            '</div>' +
            '<div class="card-actions">' +
              '<button class="btn-icon btn-qr" title="查看二维码" onclick="showQr(\'' + item.id + '\')">' +
                '<svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3z"/></svg>' +
              '</button>' +
              '<button class="btn-icon btn-link" title="复制链接" onclick="copyLink(\'' + item.id + '\')">' +
                '<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>' +
              '</button>' +
              '<button class="btn-icon btn-edit" title="编辑" onclick="openEdit(\'' + item.id + '\')">' +
                '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
              '</button>' +
              '<button class="btn-icon btn-del" title="删除" onclick="openDelete(\'' + item.id + '\')">' +
                '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>';
      });
      container.innerHTML = html;
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // 编辑
    var editId = null;
    function openEdit(id) {
      editId = id;
      var list = getPhones();
      var item = list.find(function(p) { return p.id === id; });
      if (!item) return;
      document.getElementById('editPhone').value = item.phone;
      document.getElementById('editName').value = item.name;
      document.getElementById('editModal').classList.add('show');
    }

    function saveEdit() {
      var phone = document.getElementById('editPhone').value.trim();
      var name = document.getElementById('editName').value.trim();
      if (!phone) { toast('电话号码不能为空'); return; }
      var list = getPhones();
      var item = list.find(function(p) { return p.id === editId; });
      if (item) {
        item.phone = phone;
        item.name = name;
        savePhones(list);
        renderList();
        toast('修改成功');
      }
      document.getElementById('editModal').classList.remove('show');
    }

    // 删除
    var deleteId = null;
    function openDelete(id) {
      deleteId = id;
      var list = getPhones();
      var item = list.find(function(p) { return p.id === id; });
      if (!item) return;
      document.getElementById('deleteInfo').textContent =
        (item.name ? item.name + ' - ' : '') + formatPhone(item.phone);
      document.getElementById('deleteModal').classList.add('show');
    }

    function confirmDelete() {
      var list = getPhones().filter(function(p) { return p.id !== deleteId; });
      savePhones(list);
      renderList();
      document.getElementById('deleteModal').classList.remove('show');
      toast('已删除');
    }

    // 查看二维码
    function showQr(id) {
      var list = getPhones();
      var item = list.find(function(p) { return p.id === id; });
      if (!item) return;

      var url = SITE_BASE + '?id=' + id;
      document.getElementById('qrTitle').textContent = item.name || formatPhone(item.phone);
      document.getElementById('qrUrl').textContent = url;

      var qrBox = document.getElementById('qrBox');
      qrBox.innerHTML = '';
      new QRCode(qrBox, {
        text: url,
        width: 200,
        height: 200,
        colorDark: '#13131a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('qrModal').classList.add('show');
    }

    // 下载二维码
    function downloadQr() {
      var canvas = document.querySelector('#qrBox canvas');
      if (!canvas) {
        var img = document.querySelector('#qrBox img');
        if (img) {
          var a = document.createElement('a');
          a.href = img.src;
          a.download = 'qr-code.png';
          a.click();
        }
        return;
      }
      var link = document.createElement('a');
      link.download = 'qr-code.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      toast('二维码已保存');
    }

    // 复制链接
    function copyLink(id) {
      var url = SITE_BASE + '?id=' + id;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function() {
          toast('链接已复制');
        });
      } else {
        var input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        toast('链接已复制');
      }
    }
  </script>

</body>
</html>
